sentry:
    # Leeres DSN = Sentry ist deaktiviert. In Dev/Test bleibt es leer, in
    # Produktion setzt Coolify SENTRY_DSN auf das Projekt der EU-Region.
    dsn: '%env(SENTRY_DSN)%'

    # Keine personenbezogenen Daten an Sentry (Datenschutz Stufe A): keine
    # IP-Adressen, keine Request-Bodies, keine Cookies/Header mit Nutzerbezug.
    options:
        send_default_pii: false

        # 404/405 sind kein Fehler der App, sondern meist Bot-Scanner, die nach
        # fremden Endpunkten suchen (/api/actuator, /wp-login.php, /.env …).
        # Monolog schließt dieselben Codes schon aus (excluded_http_codes).
        ignore_exceptions:
            - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
            - Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException

when@dev:
    sentry:
        # Im Entwicklungsbetrieb nie senden, auch nicht versehentlich mit gesetztem DSN.
        dsn: ~

when@test:
    sentry:
        dsn: ~
