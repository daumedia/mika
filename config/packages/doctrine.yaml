doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Fallback, falls DATABASE_URL kein serverVersion trägt. ⚠ Das serverVersion aus
        # der DATABASE_URL übersteuert diesen Wert — dort MUSS es „8.0.0" (mit Patch-Stelle)
        # heissen, nicht „8.0": DBAL 4 feuert sonst „Support for MySQL < 8", weil
        # version_compare('8.0','8.0.0','>=') = false ist.
        server_version: '8.0.0'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
